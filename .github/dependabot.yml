version: 2
updates:
  # GitHub Actions — pins action versions used across all root workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maven — root monorepo POM and all modules
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # npm — React SPA / frontend client
  - package-ecosystem: "npm"
    directory: "/tm-ui-bff/frontend-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maven — E2E Selenium test suite
  - package-ecosystem: "maven"
    directory: "/tm-orchestrator/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # NOTE: docker ecosystem intentionally omitted.
  # Application images are built by the individual module pipelines.
  # Base image versions (postgres, redis) in docker-compose.yml are managed
  # manually and updated intentionally.
