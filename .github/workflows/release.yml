name: Release — Helm Chart

# Publishes the Helm chart to GHCR OCI registry whenever a semver tag is pushed.
# Tag format: v<major>.<minor>.<patch>  (e.g., v1.0.0)
#
# Chart lives at tm-orchestrator/helm/task-manager/
# Published to: oci://ghcr.io/stefanomarcolini/charts/task-manager

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.3'

      - name: Extract chart version from git tag
        id: version
        # Strip leading 'v' from the tag (v1.0.0 → 1.0.0) for Chart.yaml
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.value }}/" \
            tm-orchestrator/helm/task-manager/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ github.ref_name }}\"/" \
            tm-orchestrator/helm/task-manager/Chart.yaml

      - name: Lint chart
        run: helm lint tm-orchestrator/helm/task-manager/

      - name: Package chart
        run: helm package tm-orchestrator/helm/task-manager/ --destination /tmp/helm-charts/

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Push chart to GHCR
        run: |
          helm push \
            /tmp/helm-charts/task-manager-${{ steps.version.outputs.value }}.tgz \
            oci://ghcr.io/stefanomarcolini/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: /tmp/helm-charts/task-manager-${{ steps.version.outputs.value }}.tgz
