          grype ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }} -o table > grype-reports/db-schema-vulnerabilities.txt 2>&1 || true
          echo "✅ DB Schema image scanned"

      - name: Upload Container Security Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: db-schema-container-reports
          path: |
            sbom-reports/db-schema-sbom.*
            grype-reports/db-schema-vulnerabilities.*
          retention-days: 30

