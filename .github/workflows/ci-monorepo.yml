      - name: Build DB Schema Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./tm-db-schema/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=tm-db-schema
          cache-to: type=gha,scope=tm-db-schema,mode=max

      - name: Generate SBOM with Syft
        run: |
          mkdir -p sbom-reports
          syft ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }} -o json > sbom-reports/db-schema-sbom.json 2>&1 || true
          syft ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }} -o cyclonedx > sbom-reports/db-schema-sbom.xml 2>&1 || true
          echo "✅ DB Schema SBOM generated"

      - name: Scan Image with Grype
        run: |
          mkdir -p grype-reports
