  publish-to-ghcr:
    name: Publish - All Images to GHCR
    runs-on: ubuntu-latest
    needs: [ build-db-schema-image, build-core-api-image, build-bff-service-image, build-frontend-image ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Git Metadata
        id: meta
        run: |
          VERSION=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Build and Push DB Schema Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./tm-db-schema/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/eisenhower-matrix/tm-db-schema:latest
            ${{ env.REGISTRY }}/eisenhower-matrix/tm-db-schema:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=tm-db-schema
          cache-to: type=gha,scope=tm-db-schema,mode=max

      - name: Build and Push Core API Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./tm-core-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/eisenhower-matrix/tm-core-api:latest
            ${{ env.REGISTRY }}/eisenhower-matrix/tm-core-api:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=tm-core-api
          cache-to: type=gha,scope=tm-core-api,mode=max

      - name: Build and Push BFF Service Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./tm-ui-bff/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/eisenhower-matrix/bff-service:latest
            ${{ env.REGISTRY }}/eisenhower-matrix/bff-service:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=bff-service
          cache-to: type=gha,scope=bff-service,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./tm-ui-bff/frontend-client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/eisenhower-matrix/frontend-client:latest
            ${{ env.REGISTRY }}/eisenhower-matrix/frontend-client:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=frontend-client
          cache-to: type=gha,scope=frontend-client,mode=max

      - name: Verify Published Images
        run: |
          echo "✅ DB Schema: ${{ env.REGISTRY }}/eisenhower-matrix/tm-db-schema:${{ steps.meta.outputs.version }}"
          echo "✅ Core API: ${{ env.REGISTRY }}/eisenhower-matrix/tm-core-api:${{ steps.meta.outputs.version }}"
          echo "✅ BFF Service: ${{ env.REGISTRY }}/eisenhower-matrix/bff-service:${{ steps.meta.outputs.version }}"
          echo "✅ Frontend: ${{ env.REGISTRY }}/eisenhower-matrix/frontend-client:${{ steps.meta.outputs.version }}"

