{{/*
Chart-managed Secret.
Only created when neither db.existingSecret nor redis.existingSecret are set,
OR when additional sensitive values (JWT secret, MFA key, SMTP password, OAuth2
client secrets) are provided inline.

For production use with an external secrets operator (External Secrets, Sealed
Secrets, Vault Agent), set existingSecret references and provide a Secret with
the required keys externally.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-manager.fullname" . }}-secrets
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
  annotations:
    # Helm does not re-render Secret values on upgrade unless the values change.
    # Use helm upgrade --set config.internalJwtSecret=... to rotate secrets.
type: Opaque
stringData:
  # Database
  {{- if not .Values.db.existingSecret }}
  DB_PASSWORD: {{ required "db.password is required when db.existingSecret is not set" .Values.db.password | quote }}
  {{- end }}

  # Redis
  {{- if not .Values.redis.existingSecret }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  {{- end }}

  # Core API — JWT / MFA
  INTERNAL_JWT_SECRET: {{ required "config.internalJwtSecret is required" .Values.config.internalJwtSecret | quote }}
  MFA_ENCRYPTION_KEY:  {{ required "config.mfaEncryptionKey is required"  .Values.config.mfaEncryptionKey  | quote }}

  # Core API — SMTP credentials
  SMTP_USERNAME: {{ .Values.config.smtpUsername | quote }}
  SMTP_PASSWORD: {{ .Values.config.smtpPassword | quote }}

  # Core API — bootstrap admin
  BOOTSTRAP_ADMIN_BCRYPT_HASH: {{ required "config.bootstrapAdminBcryptHash is required" .Values.config.bootstrapAdminBcryptHash | quote }}

  # BFF — OAuth2 client secrets (values of "disabled" are accepted by Spring Security)
  GOOGLE_CLIENT_SECRET:    {{ .Values.config.googleClientSecret    | quote }}
  MICROSOFT_CLIENT_SECRET: {{ .Values.config.microsoftClientSecret | quote }}
