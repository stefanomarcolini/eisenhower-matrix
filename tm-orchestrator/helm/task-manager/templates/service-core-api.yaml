apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-manager.fullname" . }}-core-api
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "task-manager.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: core-api
