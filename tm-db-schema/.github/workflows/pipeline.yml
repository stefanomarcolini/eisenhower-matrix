name: DB Schema Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SYFT_VERSION: '1.42.3'
  GRYPE_VERSION: '0.110.0'

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # ── Stage 1 + 3: Apply migrations, validate rollbacks ──────────────────────
  # 'mvn verify' spins up a PostgreSQL 17 Testcontainer, applies all 8 changesets,
  # then runs 'liquibase rollbackCount 1' for each — validating every rollback block.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run migration tests
        run: mvn --no-transfer-progress verify

  # ── Stage 2: Dependency vulnerability scan ─────────────────────────────────
  # Grype scans the repository filesystem and fails on HIGH/CRITICAL findings.
  scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Install Grype (checksum verified)
        run: |
          set -euo pipefail
          GRYPE_ARCHIVE="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${GRYPE_ARCHIVE}"
          curl -fsSLo grype_checksums.txt "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_checksums.txt"
          grep " ${GRYPE_ARCHIVE}$" grype_checksums.txt > grype_checksum_line.txt
          sha256sum -c grype_checksum_line.txt
          tar -xzf "${GRYPE_ARCHIVE}" grype
          sudo install -m 0755 grype /usr/local/bin/grype

      - name: Grype dependency scan
        run: grype dir:. --config .grype.yaml --fail-on high

  # ── Stage 4: Containerise, scan, push ───────────────────────────────────────
  # This stage verifies Syft/Grype release checksums before execution so scanner
  # binaries are supply-chain attested for audit and compliance evidence.
  publish:
    runs-on: ubuntu-latest
    needs: [test, scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "value=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Install Syft and Grype (checksum verified)
        run: |
          set -euo pipefail

          SYFT_ARCHIVE="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${SYFT_ARCHIVE}"
          curl -fsSLo syft_checksums.txt "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt"
          grep " ${SYFT_ARCHIVE}$" syft_checksums.txt > syft_checksum_line.txt
          sha256sum -c syft_checksum_line.txt
          tar -xzf "${SYFT_ARCHIVE}" syft
          sudo install -m 0755 syft /usr/local/bin/syft

          GRYPE_ARCHIVE="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${GRYPE_ARCHIVE}"
          curl -fsSLo grype_checksums.txt "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_checksums.txt"
          grep " ${GRYPE_ARCHIVE}$" grype_checksums.txt > grype_checksum_line.txt
          sha256sum -c grype_checksum_line.txt
          tar -xzf "${GRYPE_ARCHIVE}" grype
          sudo install -m 0755 grype /usr/local/bin/grype

          syft version
          grype version

      - name: Build image (local)
        run: >-
          docker buildx build .
          --load
          --tag tm-db-schema:${{ steps.tag.outputs.value }}
          --cache-from type=gha
          --cache-to type=gha,mode=max

      - name: Generate SBOM (CycloneDX JSON)
        run: syft "tm-db-schema:${{ steps.tag.outputs.value }}" -o cyclonedx-json=sbom.tm-db-schema.json

      - name: Grype image scan
        run: grype "tm-db-schema:${{ steps.tag.outputs.value }}" --config .grype.yaml --fail-on high

      - name: Upload SBOM and checksum evidence
        uses: actions/upload-artifact@v7
        with:
          name: tm-db-schema-security-evidence-${{ steps.tag.outputs.value }}
          path: |
            sbom.tm-db-schema.json
            syft_checksums.txt
            syft_checksum_line.txt
            grype_checksums.txt
            grype_checksum_line.txt
          if-no-files-found: error

      - name: Push image to GHCR
        run: >-
          docker buildx build .
          --push
          --tag ghcr.io/sm-task-manager/tm-db-schema:${{ steps.tag.outputs.value }}
          --tag ghcr.io/sm-task-manager/tm-db-schema:latest
          --cache-from type=gha

