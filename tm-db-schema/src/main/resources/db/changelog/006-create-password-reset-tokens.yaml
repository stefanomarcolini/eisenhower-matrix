databaseChangeLog:
  - changeSet:
      id: 006-create-password-reset-tokens
      author: system
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  # Must be a LOCAL auth user.
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_reset_tokens_user
                    references: users(id)
              - column:
                  # SHA-256 hash of the raw token sent by email. The raw token is never stored.
                  name: token_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  # NULL if not yet used. Set to now() on single-use consumption.
                  name: used_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        # Look up active tokens for a user
        - createIndex:
            indexName: idx_reset_tokens_user
            tableName: password_reset_tokens
            columns:
              - column:
                  name: user_id

        # Token validation during reset flow
        - createIndex:
            indexName: idx_reset_tokens_hash
            tableName: password_reset_tokens
            columns:
              - column:
                  name: token_hash

      rollback:
        - dropIndex:
            indexName: idx_reset_tokens_user
            tableName: password_reset_tokens
        - dropIndex:
            indexName: idx_reset_tokens_hash
            tableName: password_reset_tokens
        - dropTable:
            tableName: password_reset_tokens